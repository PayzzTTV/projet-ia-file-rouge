<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recherche d'alternance</title>
  <link rel="stylesheet" href="recherche.css">
</head>
<body>
  <header class="hero">
    <h1>Rechercher une alternance</h1>
    <p>Trouvez l'offre idéale selon vos critères.</p>
  </header>

  <main class="filters">
    <label for="field">Spécialisation</label>
    <select id="field">
      <option>Développement Web</option>
      <option>Data</option>
      <option>Cybersecurity</option>
      <option>Marketing</option>
    </select>

    <label for="education">Niveau d'études</label>
    <select id="education">
      <option>Bac+2</option>
      <option>Bac+3</option>
      <option>Bac+5</option>
    </select>

    <label for="keywords">Mot clé</label>
    <input type="text" id="keywords" placeholder="Ex : React, Data...">

    <button>Rechercher</button>
  </main>

  <footer>
    <p>&copy; 2025 Job Students</p>
  </footer>
</body>
</html>
