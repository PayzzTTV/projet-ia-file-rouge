<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Déposer un CV</title>
  <link rel="stylesheet" href="deposer-un-cv.css">
</head>
<body>
  <header class="hero">
    <h1>Déposer mon CV</h1>
    <p>Faites-vous repérer par des recruteurs dès aujourd'hui.</p>
  </header>

  <main class="form-container">
    <form>
      <div class="form-group">
        <label for="fullname">Nom complet</label>
        <input type="text" id="fullname" required>
      </div>
      <div class="form-group">
        <label for="education">Formation</label>
        <input type="text" id="education" required>
      </div>
      <div class="form-group">
        <label for="experience">Expérience</label>
        <textarea id="experience" rows="4" required></textarea>
      </div>
      <div class="form-group">
        <label for="skills">Compétences</label>
        <textarea id="skills" rows="3" required></textarea>
      </div>
      <button type="submit">Envoyer le CV</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Job Students</p>
  </footer>
</body>
</html>
